<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nova Leitura</title>

    <link rel="icon" type="image/svg+xml" href="cisk_club.svg" />

    <link rel="stylesheet" href="style.css">

</head>


<body>

<header>

    <div class="container navbar">

        <a
            href="Minha estante.html"
            class="logo"
        >
            <img src="cisk_club.svg" class="logo-img" alt="Logo">
        </a>

    </div>

</header>


<main class="container pagina-form">

    <section class="card form-card">

        <h1>
            Adicionar Nova Leitura
        </h1>


        <form id="formNovaLeitura">

            <div class="form-group">

                <label for="tituloLivro">
                    TÍTULO
                </label>

                <input
                    type="text"
                    id="tituloLivro"
                    required
                >

            </div>


            <div class="form-group">

                <label for="autorLivro">
                    AUTOR
                </label>

                <input
                    type="text"
                    id="autorLivro"
                    required
                >

            </div>


            <div class="form-group">

                <label for="paginasLivro">
                    PÁGINAS
                </label>

                <input
                    type="number"
                    id="paginasLivro"
                    min="1"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn btn-roxo botao-form"
            >
                Adicionar Livro
            </button>


            <a
                href="estante.html"
                class="btn btn-claro botao-form"
            >
                Cancelar
            </a>

        </form>

    </section>

</main>


<script src="banco%20de%20dados/dados-fixos.js"></script>
<script src="banco%20de%20dados/db.js"></script>
<script src="script.js"></script>

</body>

</html>
