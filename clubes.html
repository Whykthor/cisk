<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Clubes</title>

    <link rel="icon" type="image/svg+xml" href="cisk_club.svg" />

    <link rel="stylesheet" href="style.css">

</head>


<body>

<header>

    <div class="container navbar">

        <a
            href="tela inicio.html"
            class="logo"
        >
            <img src="cisk_club.svg" class="logo-img" alt="Logo">
        </a>

    </div>

</header>


<main class="container pagina-form">

    <h1>Meus Clubes</h1>

    <form id="formCriarClube">

        <div class="form-group">

            <label for="nomeClube">
                NOME DO CLUBE
            </label>

            <input
                type="text"
                id="nomeClube"
                required
                placeholder="Nome do clube"
            >

        </div>

        <button
            type="submit"
            class="btn btn-roxo botao-form"
        >
            Criar Clube
        </button>

        <a
            href="tela inicio.html"
            class="btn btn-claro botao-form"
        >
            Voltar
        </a>

    </form>

    <section id="listaClubes">

        <h2>Seus Clubes</h2>

        <div id="clubesGrid"></div>

    </section>

</main>


<script src="banco%20de%20dados/dados-fixos.js"></script>
<script src="banco%20de%20dados/db.js"></script>
<script src="script.js"></script>

</body>

</html>
